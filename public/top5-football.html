<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Top 5 Leagues (2026/2027) — Live Browser Simulation</title>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b101b; color: #eef2ff; margin: 0; padding: 20px; }
    nav { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    nav a, nav button { background: #162033; color: #fff; border: 1px solid #2b3b5a; padding: 8px 14px; border-radius: 6px; text-decoration: none; cursor: pointer; font-size: 13px; font-weight: 600; }
    nav a:hover, nav a.active { background: #1e293b; border-color: #38bdf8; color: #38bdf8; }
    .controls { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
    select, button.primary { background: #1d4ed8; color: #fff; border: none; padding: 9px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
    button { background: #1f2937; color: #e2e8f0; border: 1px solid #374151; padding: 9px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    button:hover { background: #374151; }
    button.primary:hover { background: #2563eb; }
    table { width: 100%; border-collapse: collapse; background: #111827; margin-bottom: 20px; border-radius: 8px; overflow: hidden; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #1f2937; text-align: left; font-size: 14px; }
    th { background: #1f2937; color: #94a3b8; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.05em; }
    .feed { background: #111827; padding: 14px; border-radius: 8px; max-height: 260px; overflow-y: auto; font-family: monospace; font-size: 13px; border: 1px solid #1f2937; }
    .feed div { padding: 4px 0; border-bottom: 1px solid #1a2234; }
    code { background: #1e293b; color: #38bdf8; padding: 3px 8px; border-radius: 4px; font-size: 13px; }
    .header-box { background: #111827; border: 1px solid #1f2937; padding: 16px; border-radius: 8px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Home</a>
    <a href="/aviator.html">Aviator</a>
    <a href="/sports.html">Sports & Odds</a>
    <a href="/top5-football.html" class="active">Top 5 Football (26/27)</a>
    <a href="/account.html">Profile & Withdrawals</a>
  </nav>

  <div class="header-box">
    <h1 style="margin:0 0 8px 0; font-size: 22px;">Top 5 Football Leagues (2026/2027) — Browser Sim Engine</h1>
    <p style="margin: 0; color: #94a3b8;">Odds Settlement Wallet: <code id="wallet-display">4AB1u2f16V1Vno2fzN4GTN41MTSWjW4E3ViN4bg3qA4m</code></p>
  </div>

  <div class="controls">
    <label for="league-select" style="font-size: 14px; font-weight: 600;">League:</label>
    <select id="league-select">
      <option value="EPL">Premier League (2026/27)</option>
      <option value="LALIGA">La Liga (2026/27)</option>
      <option value="SERIEA">Serie A (2026/27)</option>
      <option value="BUNDESLIGA">Bundesliga (2026/27)</option>
      <option value="LIGUE1">Ligue 1 (2026/27)</option>
    </select>
    <button class="primary" id="sim-round-btn">Simulate League Round</button>
    <button id="reset-sim-btn">Reset League Sim</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>Pts</th>
      </tr>
    </thead>
    <tbody id="standings-body"></tbody>
  </table>

  <h3 style="margin-top: 24px; font-size: 16px;">Live Browser Match Log (Persisted)</h3>
  <div class="feed" id="match-log"></div>

  <script>
    const LEAGUES = {
      EPL: ['Arsenal','Aston Villa','AFC Bournemouth','Brentford','Brighton & Hove Albion','Chelsea','Coventry City','Crystal Palace','Everton','Fulham','Hull City','Ipswich Town','Leeds United','Liverpool','Manchester City','Manchester United','Newcastle United','Nottingham Forest','Sunderland','Tottenham Hotspur'],
      LALIGA: ['Alaves','Ath Bilbao','Atl. Madrid','Barcelona','Betis','Celta Vigo','Dep. A Coruna','Elche','Espanyol','Getafe','Levante','Malaga','Osasuna','Racing Santander','Rayo Vallecano','Real Madrid','Real Sociedad','Sevilla','Valencia','Villarreal'],
      SERIEA: ['AC Milan','AC Monza','ACF Fiorentina','AS Roma','Atalanta BC','Bologna FC 1909','Cagliari Calcio','Como 1907','Frosinone Calcio','Genoa CFC','Inter Milan','Juventus FC','Parma Calcio 1913','S.S. Lazio','SSC Napoli','Torino FC','U.S. Lecce','U.S. Sassuolo Calcio','Udinese Calcio','Venezia FC'],
      BUNDESLIGA: ['1. FC Köln','1. FC Union Berlin','1. FSV Mainz 05','Bayer 04 Leverkusen','Borussia Dortmund','Borussia Mönchengladbach','Eintracht Frankfurt','FC Augsburg','FC Bayern München','FC Schalke 04','Hamburger SV','RB Leipzig','SC Freiburg','SC Paderborn 07','SV Elversberg','SV Werder Bremen','TSG Hoffenheim','VfB Stuttgart'],
      LIGUE1: ['AJ Auxerre','Angers SCO','AS Monaco','ES Troyes AC','FC Lorient','Le Havre AC','Le Mans FC','LOSC Lille','OGC Nice','Olympique de Marseille','Olympique Lyonnais','Paris FC','Paris Saint-Germain','RC Lens','RC Strasbourg','Stade Brestois 29','Stade Rennais','Toulouse FC']
    };

    const STORAGE_KEY = 'top5_2627_sim_state_v1';

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) return JSON.parse(saved);
      const table = {};
      for (const [code, teams] of Object.entries(LEAGUES)) {
        table[code] = teams.map((name) => ({ name, p: 0, w: 0, d: 0, l: 0, pts: 0 }));
      }
      return { table, logs: [] };
    }

    let state = loadState();

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function render() {
      const code = document.getElementById('league-select').value;
      const rows = [...state.table[code]].sort((a, b) => b.pts - a.pts || b.w - a.w || a.name.localeCompare(b.name));
      const tbody = document.getElementById('standings-body');
      tbody.innerHTML = rows.map((t, i) =>
        `<tr><td>${i + 1}</td><td>${t.name}</td><td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td><strong>${t.pts}</strong></td></tr>`
      ).join('');

      const logEl = document.getElementById('match-log');
      logEl.innerHTML = state.logs
        .filter((item) => item.code === code)
        .slice(0, 30)
        .map((item) => `<div>[${item.code}] ${item.home} <strong>${item.hg} - ${item.ag}</strong> ${item.away}</div>`)
        .join('') || '<div>No simulated matches yet for this league.</div>';
    }

    document.getElementById('sim-round-btn').addEventListener('click', () => {
      const code = document.getElementById('league-select').value;
      const teams = state.table[code];
      const shuffled = [...teams].sort(() => Math.random() - 0.5);

      for (let i = 0; i + 1 < shuffled.length; i += 2) {
        const home = shuffled[i];
        const away = shuffled[i + 1];
        const hg = Math.floor(Math.random() * 4);
        const ag = Math.floor(Math.random() * 4);

        home.p += 1;
        away.p += 1;
        if (hg > ag) {
          home.w += 1; home.pts += 3; away.l += 1;
        } else if (ag > hg) {
          away.w += 1; away.pts += 3; home.l += 1;
        } else {
          home.d += 1; away.d += 1; home.pts += 1; away.pts += 1;
        }

        state.logs.unshift({ code, home: home.name, away: away.name, hg, ag, ts: Date.now() });
      }
      saveState();
      render();
    });

    document.getElementById('reset-sim-btn').addEventListener('click', () => {
      localStorage.removeItem(STORAGE_KEY);
      state = loadState();
      render();
    });

    document.getElementById('league-select').addEventListener('change', render);
    render();
  </script>
</body>
</html>
