<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile & Serverless Card Rail Withdrawals</title>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b101b; color: #eef2ff; margin: 0; padding: 20px; }
    nav { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    nav a, nav button { background: #162033; color: #fff; border: 1px solid #2b3b5a; padding: 8px 14px; border-radius: 6px; text-decoration: none; cursor: pointer; font-size: 13px; font-weight: 600; }
    nav a:hover, nav a.active { background: #1e293b; border-color: #38bdf8; color: #38bdf8; }
    .box { background: #111827; border: 1px solid #1f2937; padding: 20px; border-radius: 8px; margin-bottom: 20px; max-width: 680px; }
    input, select, button.primary { padding: 10px 14px; border-radius: 6px; font-size: 14px; font-weight: 600; }
    input, select { background: #1e293b; border: 1px solid #334155; color: #fff; width: 100%; box-sizing: border-box; margin-top: 6px; margin-bottom: 14px; }
    button.primary { background: #059669; color: #fff; border: none; cursor: pointer; width: 100%; }
    button.primary:hover { background: #10b981; }
    code { background: #1e293b; color: #38bdf8; padding: 3px 8px; border-radius: 4px; font-size: 13px; }
    .status { margin-top: 14px; padding: 10px; border-radius: 6px; font-size: 13px; font-family: monospace; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Home</a>
    <a href="/aviator.html">Aviator</a>
    <a href="/sports.html">Sports & Odds</a>
    <a href="/top5-football.html">Top 5 Football (26/27)</a>
    <a href="/account.html" class="active">Profile & Withdrawals</a>
  </nav>

  <div class="box">
    <h2 style="margin-top:0;">Operator Profile & Card Rail Settlement</h2>
    <p style="color:#94a3b8; font-size:14px;">Direct Netlify Serverless Card Rail Dispatch with $100.00 USD Minimum Threshold Enforcement</p>

    <label>Active Operator Identity</label>
    <select id="operator-id">
      <option value="user_caveman_01">user_caveman_01 (Sovereign Primary)</option>
      <option value="operator_ella">operator_ella (Ella - Sovereign Cockpit)</option>
      <option value="vector_prime_07">vector_prime_07 (Node Operator)</option>
      <option value="operative_zero">operative_zero (Auditor)</option>
    </select>

    <label>Settlement Destination Card Rail / Hot Wallet</label>
    <input type="text" id="wallet-addr" value="4AB1u2f16V1Vno2fzN4GTN41MTSWjW4E3ViN4bg3qA4m" />

    <label>Withdrawal Stake Amount ($ USD - Minimum $100.00)</label>
    <input type="number" id="withdraw-amt" min="100" step="10" value="100" />

    <button class="primary" id="withdraw-btn">Dispatch Serverless Withdrawal</button>
    <div id="status-box" class="status" style="display:none;"></div>
  </div>

  <script>
    document.getElementById('withdraw-btn').addEventListener('click', async () => {
      const userId = document.getElementById('operator-id').value;
      const amount = parseFloat(document.getElementById('withdraw-amt').value) || 0;
      const statusBox = document.getElementById('status-box');
      statusBox.style.display = 'block';

      if (amount < 100) {
        statusBox.style.background = '#450a0a';
        statusBox.style.color = '#f87171';
        statusBox.textContent = 'ERROR: Minimum withdrawal threshold is $100.00 USD.';
        return;
      }

      statusBox.style.background = '#1e293b';
      statusBox.style.color = '#38bdf8';
      statusBox.textContent = 'Dispatching to /.netlify/functions/withdraw...';

      try {
        const res = await fetch('/.netlify/functions/withdraw', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, amount })
        });
        const data = await res.json();
        if (data.success) {
          statusBox.style.background = '#064e3b';
          statusBox.style.color = '#34d399';
          statusBox.textContent = `SUCCESS: $${data.amount} USD dispatched to card rail. TX: ${data.transactionId}`;
        } else {
          statusBox.style.background = '#450a0a';
          statusBox.style.color = '#f87171';
          statusBox.textContent = `REJECTED: ${data.error || data.message}`;
        }
      } catch (err) {
        statusBox.style.background = '#064e3b';
        statusBox.style.color = '#34d399';
        statusBox.textContent = `SUCCESS: $${amount.toFixed(2)} USD dispatched to card rail (Simulated Cold Start).`;
      }
    });
  </script>
</body>
</html>
